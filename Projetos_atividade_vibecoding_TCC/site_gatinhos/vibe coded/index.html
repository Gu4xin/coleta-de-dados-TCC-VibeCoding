<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gatinhos Fofos & Música</title>
    
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Nunito:wght@400;700;900&display=swap');

        :root {
            --cor-fundo: #ffb6c1; /* Fundo rosa claro (LightPink) */
            --cor-texto: #4a2c2a;
            --cor-botao: #ff69b4; /* Rosa mais forte (HotPink) */
            --cor-botao-hover: #ff1493; /* Rosa profundo (DeepPink) */
            --cor-card: #ffffff;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background-color: var(--cor-fundo);
            font-family: 'Nunito', sans-serif;
            color: var(--cor-texto);
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 20px;
            text-align: center;
        }

        h1 {
            font-size: 2.5rem;
            margin-bottom: 20px;
            color: #d81b60;
            text-shadow: 2px 2px 4px rgba(255, 255, 255, 0.5);
        }

        /* Seção do Gato Principal */
        .featured-section {
            width: 100%;
            max-width: 700px;
            background: var(--cor-card);
            padding: 20px;
            border-radius: 20px;
            box-shadow: 0 10px 20px rgba(0, 0, 0, 0.1);
            margin-bottom: 30px;
        }

        .featured-image-container {
            width: 100%;
            border-radius: 15px;
            overflow: hidden;
            margin-bottom: 20px;
        }

        .featured-image-container img {
            width: 100%;
            height: auto;
            display: block;
            object-fit: cover;
            /* Usando um placeholder de gato para o piano */
        }

        .featured-title {
            font-size: 1.5rem;
            margin-bottom: 15px;
            color: #d81b60;
        }

        /* Interação do Piano */
        .piano-interaction {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 15px;
            padding: 10px;
        }

        button {
            background-color: var(--cor-botao);
            color: white;
            border: none;
            padding: 15px 30px;
            font-size: 1.2rem;
            font-weight: 700;
            border-radius: 50px;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 5px 15px rgba(255, 105, 180, 0.4);
            font-family: 'Nunito', sans-serif;
        }

        button:hover {
            background-color: var(--cor-botao-hover);
            transform: translateY(-2px);
            box-shadow: 0 8px 20px rgba(255, 105, 180, 0.6);
        }

        button:active {
            transform: translateY(2px);
            box-shadow: 0 2px 10px rgba(255, 105, 180, 0.4);
        }

        .note-display {
            font-size: 3rem;
            font-weight: 900;
            color: #d81b60;
            min-height: 60px; /* Mantém o espaço para a nota mesmo quando vazio */
            display: flex;
            align-items: center;
            justify-content: center;
            transition: transform 0.2s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        .note-display.pop {
            transform: scale(1.3);
            color: #ff1493;
        }

        /* Seção de Galeria (Outros 3 gatos) */
        .gallery-section {
            width: 100%;
            max-width: 1000px;
            display: flex;
            flex-wrap: wrap;
            gap: 20px;
            justify-content: center;
            margin-bottom: 40px;
        }

        .gallery-item {
            background: var(--cor-card);
            border-radius: 15px;
            padding: 15px;
            width: 100%;
            max-width: 300px;
            box-shadow: 0 8px 15px rgba(0, 0, 0, 0.08);
            transition: transform 0.3s ease;
            flex: 1 1 250px; /* Cresce e encolhe, base de 250px */
        }

        .gallery-item:hover {
            transform: translateY(-5px);
        }

        .gallery-item img {
            width: 100%;
            height: 250px;
            object-fit: cover;
            border-radius: 10px;
            margin-bottom: 10px;
        }

        .gallery-item p {
            font-size: 1.1rem;
            font-weight: 700;
            color: var(--cor-texto);
        }

    </style>
</head>
<body>

    <h1>🐱 Gatinhos Fofos & Música 🎵</h1>

    <main>
        <!-- Gato Principal (Piano) -->
        <section class="featured-section">
            <h2 class="featured-title">O Grande Maestro Felino</h2>
            <div class="featured-image-container">
                <!-- Imagem ilustrativa usando Unsplash / Placecats -->
                <img src="https://images.unsplash.com/photo-1514888286974-6c03e2ca1dba?auto=format&fit=crop&w=800&q=80" alt="Gato tocando piano (ilustrativo)">
            </div>
            
            <div class="piano-interaction">
                <p>Clique no botão abaixo para pedir ao maestro uma nota musical!</p>
                <button id="note-btn">🎶 Tocar uma Nota!</button>
                <div id="note-display" class="note-display">-</div>
            </div>
        </section>

        <!-- Galeria de 3 Gatinhos -->
        <section class="gallery-section">
            
            <div class="gallery-item">
                <!-- Usando imagens da internet como placeholders para gatos fofos -->
                <img src="https://images.unsplash.com/photo-1573865526739-10659fec78a5?auto=format&fit=crop&w=400&q=80" alt="Gato 1">
                <p>Gato 1 - Gato na caixa</p>
            </div>

            <div class="gallery-item">
                <img src="https://images.unsplash.com/photo-1533738363-b7f9aef128ce?auto=format&fit=crop&w=400&q=80" alt="Gato 2">
                <p>Gato 2 - Gato com óculos de sol</p>
            </div>

            <div class="gallery-item">
                <img src="https://images.unsplash.com/photo-1529778458720-3b47cddc5d57?auto=format&fit=crop&w=400&q=80" alt="Gato 3">
                <p>Gato 3 - Gato curioso na cama</p>
            </div>

        </section>
    </main>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            // Array com as notas musicais solicitadas
            const notas = ['Dó', 'Ré', 'Mi', 'Fá', 'Sol', 'Lá', 'Si'];
            
            // Selecionando os elementos do DOM
            const botao = document.getElementById('note-btn');
            const displayNota = document.getElementById('note-display');

            // Adicionando evento de clique no botão
            botao.addEventListener('click', () => {
                // Sorteia um número aleatório entre 0 e o tamanho do array de notas
                const indiceAleatorio = Math.floor(Math.random() * notas.length);
                const notaSorteada = notas[indiceAleatorio];

                // Atualiza o texto na tela
                displayNota.textContent = notaSorteada;

                // Remove a classe de animação (caso já exista) para poder ativar novamente
                displayNota.classList.remove('pop');
                
                // Força um pequeno atraso (reflow) para a animação CSS reiniciar
                void displayNota.offsetWidth;
                
                // Adiciona a classe que faz o texto "pular"
                displayNota.classList.add('pop');
            });
        });
    </script>

</body>
</html>
