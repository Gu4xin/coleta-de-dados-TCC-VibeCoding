<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gotham City | Arquivos</title>
    <link rel="stylesheet" href="styles.css">
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;700;900&display=swap" rel="stylesheet">
</head>
<body>
    <div class="skyline"></div>
    <main class="container">
        <header>
            <h1 class="title">GOTHAM <span class="highlight">NIGHTS</span></h1>
            <p class="subtitle">Quando a luz não alcança, o morcego vigia.</p>
        </header>
        
        <section class="content">
            <div class="card">
                <img src="https://images.unsplash.com/photo-1509347528160-9a9e33742cdb?q=80&w=1470&auto=format&fit=crop" alt="Gotham City Dark Alley" class="hero-img">
                <div class="card-info">
                    <h2>Vigilante de Gotham</h2>
                    <p>Um bilionário de dia, o maior detetive do mundo à noite. A justiça tem um novo símbolo e o medo uma nova face nas sombras.</p>
                    <button id="signal-btn" class="btn-pro">Ativar Bat-Sinal</button>
                </div>
            </div>
        </section>
    </main>
    <div id="bat-signal-overlay" class="hidden"></div>
    <script src="script.js"></script>
</body>
</html>
